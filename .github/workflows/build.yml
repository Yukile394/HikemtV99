name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      paper_version:
        description: "Paper API surumu (ornek: 1.21.4-R0.1-SNAPSHOT)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Wrapper jar yoksa olustur
        id: wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2 --distribution-type bin
            echo "generated=true" >> "$GITHUB_OUTPUT"
          fi
          chmod +x gradlew

      - name: Derle
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.paper_version }}" ]; then EXTRA="-PpaperVersion=${{ github.event.inputs.paper_version }}"; fi
          ./gradlew build --no-daemon --stacktrace $EXTRA 2>&1 | tee build.log

      - name: Jar yukle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Spartan-jar
          path: build/libs/Spartan.jar

      - name: Derleme logu yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Wrapper jar'i repoya ekle
        if: success() && steps.wrapper.outputs.generated == 'true' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties gradlew gradlew.bat
          git commit -m "Add Gradle wrapper [skip ci]" || exit 0
          git push
